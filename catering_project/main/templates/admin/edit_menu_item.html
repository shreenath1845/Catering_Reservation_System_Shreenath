<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Edit Menu Item</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

  <style>
    body {
      background: linear-gradient(135deg, #f3f4f6, #ffffff);
      font-family: 'Segoe UI', sans-serif;
    }
    .form-container {
      max-width: 650px;
      margin: 4rem auto;
      padding: 2rem;
      border-radius: 15px;
      background-color: #ffffff;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.08);
    }
    .form-img-preview {
      max-width: 140px;
      border-radius: 10px;
      margin-bottom: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    .form-label i {
      margin-right: 6px;
      color: #0d6efd;
    }
    .btn-primary i, .btn-secondary i {
      margin-right: 6px;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="form-container">
    <h3 class="text-center text-primary mb-4"><i class="fas fa-pen-to-square"></i> Edit Menu Item</h3>

    <form method="POST" enctype="multipart/form-data">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label"><i class="fas fa-utensils"></i> Item Name</label>
        <input type="text" name="name" class="form-control" value="{{ item.name }}" required>
      </div>

      <div class="mb-3 text-center">
        <label class="form-label d-block"><i class="fas fa-image"></i> Current Image</label>
        <img src="{{ item.image.url }}" alt="Item Image" class="form-img-preview">
      </div>

      <div class="mb-3">
        <label class="form-label"><i class="fas fa-upload"></i> Change Image (optional)</label>
        <input type="file" name="image" class="form-control" accept="image/*">
      </div>

      <div class="mb-3">
        <label class="form-label"><i class="fas fa-rupee-sign"></i> Price</label>
        <input type="number" name="price" step="0.01" class="form-control" value="{{ item.price }}" required>
      </div>

      <div class="mb-3">
        <label class="form-label"><i class="fas fa-align-left"></i> Description</label>
        <textarea name="description" class="form-control" rows="4" required>{{ item.description }}</textarea>
      </div>

      <div class="text-center mt-4">
        <button type="submit" class="btn btn-primary">
          <i class="fas fa-save"></i> Update Item
        </button>
        <a href="{% url 'view_menu_admin' %}" class="btn btn-secondary ms-2">
          <i class="fas fa-arrow-left"></i> Back to Menu
        </a>
      </div>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
