<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Add Menu Item</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
</head>
<body style="background: #f2f2f2;">

  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold" href="{% url 'admin_dashboard' %}"><i class="fas fa-cogs"></i> Admin Panel</a>
      <div class="collapse navbar-collapse">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link active" href="{% url 'add_item_page' %}">➕ Add Item</a></li>
          <li class="nav-item"><a class="nav-link " href="{% url 'view_menu_admin' %}">📋 View Menu</a></li>
          <li class="nav-item"><a class="nav-link " href="{% url 'admin_orders' %}">📦 Orders</a></li>
          <li class="nav-item"><a class="nav-link " href="{% url 'admin_reservations' %}">📅 Reservations</a></li>
        </ul>
        <ul class="navbar-nav">
          <li class="nav-item">
            <form method="post" action="{% url 'logout' %}">
              {% csrf_token %}
              <button type="submit" class="btn btn-outline-light btn-sm">🚪 Logout</button>
            </form>
          </li>
      </div>
    </div>
  </nav>


<div class="container mt-5">
  <div class="card shadow p-4">
    <h3 class="text-center text-success mb-4">➕ Add New Menu Item</h3>
    <form method="POST" enctype="multipart/form-data">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label">Item Name</label>
        <input type="text" name="name" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Item Image</label>
        <input type="file" name="image" class="form-control" accept="image/*" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Price (₹)</label>
        <input type="number" name="price" step="0.01" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Description</label>
        <textarea name="description" rows="3" class="form-control" required></textarea>
      </div>
      <button type="submit" class="btn btn-success w-100">Add Item</button>
    </form>
  </div>
</div>

<footer class="text-center text-muted mb-4">
  <hr class="my-4">
  <p>Designed by <strong>@Shreenath Naik A</strong> 💻</p>
</footer>

</body>
</html>
