<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Checkout - Place Order</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body style="background-color: #f8f9fa;">

<div class="container mt-5">
  <h2 class="text-center text-primary mb-4">🛒 Checkout</h2>

  <form method="POST">
    {% csrf_token %}
    <div class="mb-3">
        <label>Name</label>
        <input type="text" name="customer_name" class="form-control" required>
      </div>
      <div class="mb-3">
        <label>Phone</label>
        <input type="tel" name="phone" class="form-control" required>
      </div>


    <div class="mb-3">
      <label class="form-label">Delivery Address</label>
      <textarea name="address" class="form-control" rows="3" placeholder="Enter your delivery address" required></textarea>
    </div>

    <div class="mb-3">
      <label class="form-label">Payment Method</label>
      <select name="payment_method" class="form-select" required>
        <option value="">-- Select Payment Method --</option>
        <option value="Cash on Delivery">Cash on Delivery</option>
        <option value="Google Pay">Google Pay</option>
        <option value="PhonePe">PhonePe</option>
        <option value="Paytm">Paytm</option>
        <option value="UPI">UPI</option>
        <option value="Credit Card">Credit Card</option>
      </select>
    </div>

    <div class="text-end">
      <button type="submit" class="btn btn-success"><i class="fas fa-check-circle"></i> Place Order</button>
    </div>
  </form>
</div>
<footer class="text-center text-muted mb-4">
  <hr class="my-4">
  <p>Designed by <strong>@Shreenath Naik A</strong> 💻</p>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
